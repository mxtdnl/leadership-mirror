<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Leadership Mirror — Meridian Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0c0b;--s1:#161513;--s2:#1e1d1a;--b1:#252220;--b2:#302d28;
  --t1:#ede8df;--t2:#8a8580;--t3:#4a4742;--t4:#2e2c28;
  --gold:#c49838;--gold-l:#ddb84e;--gold-d:rgba(196,152,56,0.1);
  --red:#9e3a3a;--red-l:#c45050;--red-d:rgba(158,58,58,0.1);
  --grn:#3a7d58;--grn-l:#4da070;--grn-d:rgba(58,125,88,0.1);
  --ff-s:'Playfair Display',Georgia,serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
html,body{min-height:100vh;background:var(--bg);color:var(--t1);font-family:var(--ff-b);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.screen{width:100%;max-width:680px}
.screen.enter{animation:up 0.45s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fade 0.4s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.eyebrow{display:block;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1{font-family:var(--ff-s);font-size:clamp(2.1rem,5vw,3rem);font-weight:700;line-height:1.08;letter-spacing:-0.01em;margin-bottom:20px}
h2{font-family:var(--ff-s);font-size:clamp(1.45rem,3vw,1.9rem);font-weight:600;line-height:1.15;margin-bottom:14px}
h3{font-family:var(--ff-s);font-size:1.15rem;font-weight:600;line-height:1.25;margin-bottom:10px}
p{color:var(--t2);margin-bottom:14px;font-size:15px}
p:last-child{margin-bottom:0}
p.lead{font-size:16px;color:var(--t1);line-height:1.72}
hr{border:none;border-top:1px solid var(--b1);margin:28px 0}
em{font-style:italic;color:var(--t1)}
.muted-note{font-size:12px;color:var(--t4)}
.spacer{height:20px}

.bar-wrap{margin-bottom:34px}
.bar-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.bar-meta span{font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3)}
.bar{height:2px;background:var(--b1)}
.bar-fill{height:100%;background:var(--gold);transition:width 0.5s var(--ease)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 30px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);font-family:var(--ff-b);font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s,color 0.2s}
.btn:hover{background:var(--gold-d)}
.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.btn.primary{background:var(--gold);color:#0d0c0b}
.btn.primary:hover{background:var(--gold-l)}
.btn.muted{border-color:var(--b2);color:var(--t3)}
.btn.muted:hover{background:var(--s2);color:var(--t2)}
.btn[disabled]{opacity:0.38;cursor:not-allowed;pointer-events:none}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.textlink{background:none;border:none;color:var(--t3);font-family:var(--ff-b);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
.textlink:hover{color:var(--gold-l)}

.title-bar{width:36px;height:2px;background:var(--gold);margin-bottom:28px}
.dom-icon{display:inline-flex;color:var(--gold);vertical-align:middle}
.dom-icon svg{width:20px;height:20px}
.head-icon{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head-icon .dom-icon svg{width:26px;height:26px}

.stmt-card{background:var(--s1);border:1px solid var(--b1);padding:44px 40px;margin-bottom:24px;position:relative}
.stmt-num{position:absolute;top:18px;right:22px;font-size:10px;letter-spacing:0.1em;color:var(--t4)}
.stmt-card .dom-icon{position:absolute;top:16px;left:20px}
.stmt-text{font-family:var(--ff-s);font-size:1.15rem;font-weight:400;line-height:1.58;color:var(--t1);font-style:italic;margin-top:14px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:28px}
.sc-btn{padding:10px 4px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-family:var(--ff-b);font-size:10px;text-align:center;cursor:pointer;transition:all 0.15s;line-height:1.35}
.sc-btn:hover{border-color:var(--b2);color:var(--t1);background:var(--s2)}
.sc-btn.on{border-color:var(--gold);background:var(--gold-d);color:var(--gold-l)}
.sc-btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
.sc-btn .kbd{display:block;font-size:8px;color:var(--t4);margin-top:3px}
.scale-legend{display:flex;justify-content:space-between;margin-top:6px}
.scale-legend span{font-size:9px;letter-spacing:0.06em;color:var(--t4);text-transform:uppercase}

.svg-wrap{background:var(--s1);border:1px solid var(--b1);padding:28px;margin-bottom:24px;display:flex;flex-direction:column;align-items:center}
.svg-wrap svg{max-width:100%;height:auto}
.svg-cap{font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:var(--t3);margin-top:14px;text-align:center}
.f-none{fill:none}.f-bg{fill:var(--s1)}.f-gold{fill:var(--gold)}.f-goldl{fill:var(--gold-l)}
.f-red{fill:var(--red-l)}.f-grn{fill:var(--grn-l)}.f-t1{fill:var(--t1)}.f-t2{fill:var(--t2)}.f-t3{fill:var(--t3)}.f-b2{fill:var(--b2)}
.s-gold{stroke:var(--gold)}.s-goldl{stroke:var(--gold-l)}.s-red{stroke:var(--red-l)}.s-grn{stroke:var(--grn-l)}
.s-track{stroke:var(--b2)}.s-b1{stroke:var(--b1)}.s-t3{stroke:var(--t3)}
.svg-lbl{font-family:var(--ff-b);font-size:9px;letter-spacing:0.06em;text-transform:uppercase}
.svg-num{font-family:var(--ff-s);font-weight:700}

.score-hero{background:var(--s1);border:1px solid var(--b1);text-align:center;padding:40px 40px 36px;margin-bottom:28px}
.score-hero .lbl{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--t3);margin-top:8px}
.score-hero .sub{font-size:14px;color:var(--t2);margin-top:12px;max-width:440px;margin-left:auto;margin-right:auto}

.commit-flag{background:var(--s1);border:1px solid var(--b1);border-left:2px solid var(--gold);padding:16px 20px;margin-bottom:22px}
.commit-flag .cf-h{font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.commit-flag p{font-size:13px;margin:0}

/* Shared judgement + explanation component (reveal chain-row + final dec-row) */
.jrow{background:var(--s1);border:1px solid var(--b1);border-left:3px solid var(--b1);padding:18px 20px;margin-bottom:10px}
.jrow.bad{border-left-color:var(--red-l)}
.jrow.ok{border-left-color:var(--grn)}
.jrow.warn{border-left-color:var(--gold)}
.jrow-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.jrow-head .dom-icon svg{width:18px;height:18px}
.jrow-title{font-size:13px;font-weight:500;color:var(--t1)}
.jrow-note{font-size:13px;color:var(--t2);line-height:1.55}
.jrow-note.dim{color:var(--t4)}

.tag{display:inline-block;font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;padding:2px 7px;border:1px solid;margin-bottom:6px}
.tag-red{border-color:var(--red);color:var(--red-l);background:var(--red-d)}
.tag-grn{border-color:var(--grn);color:var(--grn-l);background:var(--grn-d)}
.tag-gold{border-color:var(--gold);color:var(--gold-l);background:var(--gold-d)}

.brief-block{background:var(--s1);border:1px solid var(--b1);border-left:2px solid var(--gold);padding:22px 24px;margin-bottom:20px}
.brief-block .bb-head{font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.brief-block p{font-size:14px;margin:0}

.scene-card{background:var(--s1);border:1px solid var(--b1);padding:32px;margin-bottom:22px}
.scene-card .sc-setup{font-size:15px;color:var(--t1);line-height:1.72;margin-bottom:16px}
.scene-card .sc-q{font-size:12px;font-style:italic;color:var(--t3)}

.p-btn{display:block;width:100%;padding:18px 20px;border:1px solid var(--b1);background:var(--s1);text-align:left;cursor:pointer;margin-bottom:10px;transition:all 0.15s}
.p-btn:hover{border-color:var(--b2);background:var(--s2)}
.p-btn.on{border-color:var(--gold);background:var(--gold-d)}
.p-btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
.p-btn .pl{font-size:9px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:5px}
.p-btn .pt{font-size:14px;color:var(--t1);line-height:1.55;font-family:var(--ff-b)}

.steps{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.step-dot{width:6px;height:6px;border-radius:50%;background:var(--b2)}
.step-dot.cur{background:var(--gold)}
.step-dot.done{background:var(--t4)}
.step-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-left:4px}

.princ-bar{display:flex;align-items:baseline;gap:10px;border:1px solid var(--b1);padding:12px 16px;margin-bottom:18px}
.princ-bar .pb-label{font-size:9px;font-weight:500;letter-spacing:0.11em;text-transform:uppercase;color:var(--gold);flex-shrink:0}
.princ-bar .pb-text{font-size:12px;color:var(--t2);font-style:italic;line-height:1.5}

.esc-card{background:var(--s1);border:1px solid var(--b1);padding:28px 30px;margin-bottom:18px}
.esc-sit{font-size:15px;color:var(--t1);line-height:1.72;padding-bottom:20px;border-bottom:1px solid var(--b1);margin-bottom:18px}
.esc-q{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}

.c-btn{display:block;width:100%;padding:14px 17px;border:1px solid var(--b1);background:transparent;color:var(--t1);text-align:left;font-family:var(--ff-b);font-size:13.5px;line-height:1.55;cursor:pointer;margin-bottom:8px;transition:all 0.15s}
.c-btn:hover{border-color:var(--b2);background:var(--s2)}
.c-btn.on{border-color:var(--gold);background:var(--gold-d)}
.c-btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:1px}
.c-btn:last-child{margin-bottom:0}

.reason-prompt{border:1px solid var(--gold);background:var(--gold-d);padding:16px 18px;margin-bottom:18px;animation:fade 0.3s var(--ease) both}
.reason-prompt .rp-h{font-size:11px;color:var(--gold-l);margin-bottom:12px;font-style:italic}
.reason-prompt .rp-btns{display:flex;gap:10px;flex-wrap:wrap}
.rp-btn{flex:1;min-width:180px;padding:12px 14px;border:1px solid var(--b2);background:var(--s1);color:var(--t2);font-family:var(--ff-b);font-size:12px;cursor:pointer;text-align:left;transition:all 0.15s}
.rp-btn:hover{border-color:var(--gold);color:var(--t1)}
.rp-btn.on{border-color:var(--gold);color:var(--gold-l);background:var(--gold-d)}

.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.sc-card{background:var(--s1);border:1px solid var(--b1);padding:28px 20px;text-align:center}
.sc-card .scn{font-family:var(--ff-s);font-size:52px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:6px}
.sc-card .sct{font-size:9px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.sc-card .scg{font-size:13px;color:var(--t2);line-height:1.5}

.insight{background:var(--s1);border:1px solid var(--b1);padding:22px 24px;margin-bottom:12px}
.insight .ih{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.insight p{font-size:14px;margin:0}
.insight .stated{font-style:italic;color:var(--t1);margin-bottom:8px}

.replay-list{margin-bottom:12px}
.replay-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:1px solid var(--b1);background:var(--s1);color:var(--t1);text-align:left;font-family:var(--ff-b);font-size:13px;cursor:pointer;margin-bottom:8px;transition:all 0.15s}
.replay-btn:hover{border-color:var(--gold);background:var(--s2)}
.replay-btn .rb-t{flex:1}
.replay-btn .rb-s{font-size:11px;color:var(--t3)}

.debrief-q{background:var(--s1);border:1px solid var(--b1);border-left:2px solid var(--gold);padding:18px 22px;margin-bottom:10px}
.debrief-q .dq-n{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.debrief-q p{font-size:14px;color:var(--t1);margin:0;line-height:1.6}
.construct{background:var(--s1);border:1px solid var(--b1);padding:20px 24px;margin-bottom:12px}
.construct .cn-h{font-family:var(--ff-s);font-size:1.05rem;color:var(--t1);margin-bottom:6px}
.construct p{font-size:13.5px;margin:0}

.analyzing{text-align:center;padding:60px 0}
.ld-dots{display:flex;gap:8px;justify-content:center;margin-top:24px}
.ld-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:ldp 1.2s infinite ease-in-out}
.ld-dot:nth-child(2){animation-delay:0.2s}
.ld-dot:nth-child(3){animation-delay:0.4s}
@keyframes ldp{0%,80%,100%{opacity:0.2;transform:scale(0.75)}40%{opacity:1;transform:scale(1)}}

/* ============ TEACHER PROJECTION MODE ============ */
.t-mode #app{padding:48px 40px}
.t-mode .screen{max-width:1040px}
.t-mode .eyebrow{font-size:13px;margin-bottom:20px}
.t-mode h1{font-size:clamp(2.6rem,6vw,4rem)}
.t-mode h2{font-size:clamp(2rem,4vw,2.8rem)}
.t-mode p{font-size:20px}
.t-mode .btn{font-size:14px;padding:16px 38px}
.t-stmt-card{background:var(--s1);border:1px solid var(--b1);padding:56px 54px;margin-bottom:30px;position:relative}
.t-stmt-card .dom-icon svg{width:38px;height:38px}
.t-stmt-text{font-family:var(--ff-s);font-size:clamp(1.8rem,3.6vw,2.4rem);font-weight:400;line-height:1.4;color:var(--t1);font-style:italic;margin-top:20px}
.t-stmt-num{position:absolute;top:26px;right:30px;font-size:14px;letter-spacing:0.1em;color:var(--t4)}
.tally-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.counter{border:1px solid var(--b1);background:var(--s2);padding:20px 10px;text-align:center;cursor:pointer;transition:all 0.15s;user-select:none}
.counter:hover{border-color:var(--gold)}
.counter.on{border-color:var(--gold);background:var(--gold-d)}
.counter .cn-lbl{font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--t2);margin-bottom:10px}
.counter .cn-val{font-family:var(--ff-s);font-size:44px;font-weight:700;color:var(--gold-l);line-height:1}
.counter .cn-key{font-size:11px;color:var(--t4);margin-top:8px}
.cn-minus{margin-top:10px;width:34px;height:34px;border:1px solid var(--b2);background:var(--s1);color:var(--t2);font-size:22px;line-height:1;cursor:pointer;border-radius:3px;transition:all 0.15s}
.cn-minus:hover{border-color:var(--gold);color:var(--gold-l);background:var(--gold-d)}
.cn-minus:disabled{opacity:0.3;cursor:not-allowed}
.histo{display:flex;align-items:flex-end;gap:12px;height:140px;padding:0 10px;margin-bottom:16px;border-bottom:1px solid var(--b1)}
.histo-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.histo-bar{width:100%;background:var(--gold);min-height:2px;transition:height 0.3s var(--ease)}
.histo-bar.dim{background:var(--b2)}
.histo-cval{font-size:13px;color:var(--t2);margin-bottom:6px}
.histo-clbl{font-size:12px;color:var(--t3);margin-top:8px;text-transform:uppercase;letter-spacing:0.05em}
.t-majority-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.t-maj-btn{padding:28px 10px;border:1px solid var(--b1);background:var(--s2);color:var(--t2);font-family:var(--ff-b);font-size:15px;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;transition:all 0.15s}
.t-maj-btn:hover{border-color:var(--gold);color:var(--t1)}
.t-maj-btn.on{border-color:var(--gold);background:var(--gold-d);color:var(--gold-l)}
.polar-flag{display:inline-block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--red-l);border:1px solid var(--red);background:var(--red-d);padding:4px 12px;margin-bottom:16px}
.disc-prompt{border:1px solid var(--gold);background:var(--gold-d);padding:22px 26px;margin-bottom:22px}
.disc-prompt .dp-h{font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.disc-prompt p{font-size:20px;color:var(--t1);font-style:italic;margin:0}
.timer{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.timer .tm-clock{font-family:var(--ff-s);font-size:34px;color:var(--gold-l);min-width:90px}
.t-opt-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.t-opt{padding:20px 24px;border:1px solid var(--b1);background:var(--s2);color:var(--t1);font-size:18px;line-height:1.5;text-align:left;cursor:pointer;transition:all 0.15s;font-family:var(--ff-b)}
.t-opt:hover{border-color:var(--gold)}
.t-opt.on{border-color:var(--gold);background:var(--gold-d)}
.t-opt .to-count{float:right;font-family:var(--ff-s);font-size:24px;color:var(--gold-l);margin-left:12px}
.session-reset{position:fixed;bottom:14px;right:16px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--t4);background:none;border:none;cursor:pointer;z-index:10}
.session-reset:hover{color:var(--t2)}
.nav-hint{position:fixed;bottom:14px;left:16px;font-size:10px;letter-spacing:0.06em;color:var(--t4);z-index:10}

@media(max-width:500px){
  .stmt-card{padding:32px 24px}
  .final-grid{grid-template-columns:1fr}
  .t-mode #app{padding:28px 18px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function(){

/* =====================================================================
   DATA — statements, belief chains, dilemmas.  No behaviour here.
   ===================================================================== */

const STMTS=[
  {id:0,chain:0,pos:0,text:"Effective leaders maintain honest, timely communication with their teams about the company's real situation — even when the news is difficult."},
  {id:1,chain:1,pos:0,text:"The strongest candidate on objective criteria should always be selected for a role — anything else compromises the integrity of the process."},
  {id:2,chain:2,pos:0,text:"Employees do their best work when given genuine autonomy over how they approach their goals — not just what to achieve, but how."},
  {id:3,chain:3,pos:0,text:"A company's primary obligation is to generate strong financial returns for its shareholders."},
  {id:4,chain:4,pos:0,text:"High performance must be rewarded consistently — making exceptions based on tenure or personal circumstance undermines the culture of meritocracy."},
  {id:5,chain:0,pos:1,text:"Sharing unconfirmed speculation with employees creates unnecessary anxiety and actively undermines organisational focus and performance."},
  {id:6,chain:1,pos:1,text:"Structural and historical barriers mean equally talented people from underrepresented groups are significantly less likely to reach senior shortlists."},
  {id:7,chain:2,pos:1,text:"A leader is ultimately accountable for everything that occurs within their organisation — accountability cannot be meaningfully delegated."},
  {id:8,chain:3,pos:1,text:"Companies must not engage in practices that cause clear harm to people or communities, even when those practices are technically legal."},
  {id:9,chain:4,pos:1,text:"Long-serving employees who have built the organisation deserve recognition that goes beyond what current performance metrics alone can capture."},
  {id:10,chain:0,pos:2,text:"When layoffs are probable but not yet decided, a leader should say nothing to the wider organisation until decisions are formally confirmed."},

// analyze(responses[15]) -> results object.
// responses may contain null (unanswered); coerced to 0 for detection.
function analyze(responses){
  const r=responses.map(v=>v==null?0:v);
  const chainResults=CHAINS.map(c=>{
    const idxs=[c.id,c.id+5,c.id+10];
    const strength=idxs.reduce((s,i)=>s+Math.abs(r[i]),0); // 0..6
    return {id:c.id,title:c.title,contradiction:c.detect(r),
      explain:c.explain,consistentNote:c.consistentNote,
      fragA:c.fragA,fragB:c.fragB,strength,idxs};
  });
  // Continuous coherence: each chain worth 20 pts; a contradiction costs
  // 20 * (how strongly it was committed to).  Lightly-held contradictions
  // cost less, so scores are continuous rather than 20-point steps.
  let penalty=0;
  chainResults.forEach(cr=>{if(cr.contradiction)penalty+=20*(cr.strength/6);});
  const score=Math.max(0,Math.min(100,Math.round(100-penalty)));

  // Commitment index — mean |response|.  Heavy neutrality trivially avoids
  // every contradiction, so surface it rather than reporting a clean score.
  const commitmentIndex=r.reduce((s,v)=>s+Math.abs(v),0)/15;
  const abstained=responses.reduce((n,v)=>n+((v==null||v===0)?1:0),0);

  // Strongest contradiction targets the stress test.
  const contradicted=chainResults.filter(c=>c.contradiction);
  let stressId;
  if(contradicted.length){
    let best=contradicted[0],mx=-1;
    contradicted.forEach(cr=>{if(cr.strength>mx){mx=cr.strength;best=cr;}});
    stressId=best.id;
  }else stressId=3;

  return {chainResults,score,commitmentIndex,abstained,stressId};
}

// Per-chain response strength as mean |response| in 0..2 (for the radar).
function chainMagnitudes(responses){
  const r=responses.map(v=>v==null?0:v);
  return CHAINS.map(c=>{
    const idxs=[c.id,c.id+5,c.id+10];
    return idxs.reduce((s,i)=>s+Math.abs(r[i]),0)/3; // 0..2
  });
}

// Principle trajectory across the three escalations.
// reasons[i] is 'updated' | 'buckled' | null (only meaningful for
// revises/abandons moves).
function scoreTrajectory(dilemma,principleId,escChoices,reasons){
  const nodes=escChoices.map((ci,i)=>{
    const tag=dilemma.escs[i].opts[ci].tags[principleId];
    return {tag,reason:reasons[i]||null,header:dilemma.escs[i].header,text:dilemma.escs[i].opts[ci].text};
  });
  const h=nodes.filter(n=>n.tag==="holds").length;
  const rev=nodes.filter(n=>n.tag==="revises").length;
  const ab=nodes.filter(n=>n.tag==="abandons").length;
  const total=nodes.length||1;
  const score=Math.round(((h+rev*0.5)/total)*100);
  const moves=nodes.filter(n=>n.tag!=="holds");
  const principled=moves.filter(n=>n.reason==="updated").length;
  const buckled=moves.filter(n=>n.reason==="buckled").length;
  return {nodes,h,rev,ab,score,principled,buckled};
}

// Whether a chosen escalation option requires a revision-reason prompt.
function needsReason(dilemma,principleId,escIdx,optIdx){
  const tag=dilemma.escs[escIdx].opts[optIdx].tags[principleId];
  return tag==="revises"||tag==="abandons";
}

/* ---------- SVG: coherence dial (arc gauge) ---------- */
function svgDial(){
  // 270deg gauge; value arc animated in mount.
  return `
<svg viewBox="0 0 220 180" width="240" role="img" aria-label="Coherence dial">
  <g transform="translate(110,105)">
    <circle class="f-none s-track" cx="0" cy="0" r="80" stroke-width="12"
      stroke-dasharray="376.99 502.65" stroke-linecap="round" transform="rotate(135)"/>
    <circle id="dial-arc" class="f-none" cx="0" cy="0" r="80" stroke-width="12"
      stroke-dasharray="0 502.65" stroke-linecap="round" transform="rotate(135)"/>
    <text id="dial-num" class="svg-num f-t1" x="0" y="4" text-anchor="middle" font-size="46">0</text>
    <text class="svg-lbl f-t3" x="0" y="34" text-anchor="middle">Coherence</text>
  </g>
</svg>`;
}
function bandColorVar(score){return score>=80?"var(--grn-l)":score>=60?"var(--gold-l)":"var(--red-l)";}
function animateDial(finalScore){
  const arc=document.getElementById("dial-arc");
  const num=document.getElementById("dial-num");
  if(!arc||!num)return;
  const col=bandColorVar(finalScore);
  arc.style.stroke=col;
  const maxLen=376.99, circ=502.65;
  const t0=performance.now(),dur=1100;
  function frame(t){
    const p=Math.min(1,(t-t0)/dur);
    const eased=1-Math.pow(1-p,3);
    const val=Math.round(finalScore*eased);
    num.textContent=val;
    const len=maxLen*(val/100);
    arc.setAttribute("stroke-dasharray",len+" "+circ);
    if(p<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- SVG: belief pentagon (radar) ---------- */
function svgPentagon(responses,chainResults){
  const mags=chainMagnitudes(responses); // 0..2 per chain
  const cx=140,cy=140,maxR=100;
  const pt=(i,r)=>{
    const ang=(-90+i*72)*Math.PI/180;
    return [cx+Math.cos(ang)*r,cy+Math.sin(ang)*r];
  };
  // grid rings
  let grid="";
  [0.33,0.66,1].forEach(f=>{
    const p=[0,1,2,3,4].map(i=>pt(i,maxR*f).map(n=>n.toFixed(1)).join(",")).join(" ");
    grid+=`<polygon class="f-none s-b1" points="${p}" stroke-width="1"/>`;
  });
  // axes + labels
  let axes="",labels="";
  for(let i=0;i<5;i++){
    const[ax,ay]=pt(i,maxR);
    axes+=`<line class="s-b1" x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke-width="1"/>`;
    const[lx,ly]=pt(i,maxR+16);
    const anchor=Math.abs(lx-cx)<6?"middle":(lx>cx?"start":"end");
    labels+=`<text class="svg-lbl f-t3" x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}">${CHAINS[i].title.split(" ")[0]}</text>`;
  }
  // data polygon points
  const dpts=mags.map((m,i)=>pt(i,maxR*(m/2)));
  // edges: red + jagged where either endpoint chain is contradicted
  let edges="",verts="";
  for(let i=0;i<5;i++){
    const a=dpts[i],b=dpts[(i+1)%5];
    const bad=chainResults[i].contradiction||chainResults[(i+1)%5].contradiction;
    if(bad){
      // jagged fractured edge
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      const dx=b[0]-a[0],dy=b[1]-a[1];
      const nx=-dy,ny=dx,nl=Math.hypot(nx,ny)||1;
      const off=7;
      const j1=[mx-dx*0.15+nx/nl*off,my-dy*0.15+ny/nl*off];
      const j2=[mx+dx*0.15-nx/nl*off,my+dy*0.15-ny/nl*off];
      edges+=`<polyline class="f-none s-red" points="${a[0].toFixed(1)},${a[1].toFixed(1)} ${j1[0].toFixed(1)},${j1[1].toFixed(1)} ${j2[0].toFixed(1)},${j2[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" stroke-width="2"/>`;
    }else{
      edges+=`<line class="s-goldl" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke-width="2"/>`;
    }
  }
  dpts.forEach((p,i)=>{
    const cls=chainResults[i].contradiction?"f-red":"f-goldl";
    verts+=`<circle class="${cls}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`;
  });
  const fillPts=dpts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
  return `
<svg viewBox="-44 0 368 300" width="300" role="img" aria-label="Belief pentagon">
  ${grid}${axes}
  <polygon points="${fillPts}" fill="var(--gold-d)"/>
  ${edges}${verts}${labels}
</svg>`;
}

/* ---------- SVG: tension diagram per contradiction ---------- */
function svgTension(cr){
  const wrap=t=>{
    // crude word-wrap into <=3 tspans
    const words=t.split(" ");const lines=[];let ln="";
    words.forEach(w=>{if((ln+" "+w).trim().length>20){lines.push(ln.trim());ln=w;}else ln+=" "+w;});
    if(ln.trim())lines.push(ln.trim());
    return lines.slice(0,3);
  };
  const nodeText=(x,lines)=>lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?0:13}">${esc(l)}</tspan>`).join("");
  const la=wrap(cr.fragA),lb=wrap(cr.fragB);
  return `
<svg viewBox="0 0 460 150" width="100%" role="img" aria-label="Tension between two beliefs">
  <rect class="f-bg s-red" x="8" y="30" width="180" height="90" rx="4" stroke-width="1.5"/>
  <rect class="f-bg s-red" x="272" y="30" width="180" height="90" rx="4" stroke-width="1.5"/>
  <text class="svg-lbl f-red" x="98" y="88" text-anchor="middle">${nodeText(98,la)}</text>
  <text class="svg-lbl f-red" x="362" y="88" text-anchor="middle">${nodeText(362,lb)}</text>
  <polyline class="f-none s-red" stroke-width="2.5" points="188,75 210,60 228,90 246,60 264,75"/>
  <text class="svg-lbl f-t3" x="230" y="130" text-anchor="middle">Strained</text>
</svg>`;
}

/* ---------- STUDENT: escalation ---------- */
function rEscalation(){
  const d=S.dilemma;
  const step=S.escStep;
  const escd=d.escs[step-1];
  const princ=d.principles.find(p=>p.id===S.principleId);
  const sel=S.escChoices[step-1];
  const hasSel=sel!==undefined&&sel!==null;
  const dots=[1,2,3].map(i=>{
    let c='step-dot';
    if(i<step)c+=' done';else if(i===step)c+=' cur';
    return`<div class="${c}"></div>`;
  }).join('');
  const opts=escd.opts.map((o,i)=>`<button class="c-btn${sel===i?' on':''}" role="button" aria-pressed="${sel===i}" data-action="selC" data-arg="${i}">${esc(o.text)}</button>`).join('');

  // Reflective-equilibrium reason prompt after a revises/abandons move.
  let reasonBlock="";
  if(hasSel && needsReason(d,S.principleId,step-1,sel)){
    const rz=S.reasons[step-1];
    reasonBlock=`
<div class="reason-prompt">
  <div class="rp-h">That decision moved away from your stated principle. Which was it?</div>
  <div class="rp-btns">
    <button class="rp-btn${rz==='updated'?' on':''}" data-action="reason" data-arg="updated">I updated on new information &mdash; the situation genuinely warranted a different call.</button>

  </div>
</div>`;
  }

  const reasonSatisfied = !hasSel ? false : (!needsReason(d,S.principleId,step-1,sel) || S.reasons[step-1]);
  const isLast=step===3;
  const btnLabel=isLast?'Complete Assessment &rarr;':'Next Escalation &rarr;';
  const btnAction=isLast?'finalize':'nextEsc';
  const btnHtml=reasonSatisfied?`<button class="btn primary" data-action="${btnAction}">${btnLabel}</button>`:"";

  return `

/* ---------- SVG: escalation trajectory ---------- */
function svgTrajectory(traj){
  const W=460,H=170,padX=60;
  const yFor=tag=>tag==="holds"?45:tag==="revises"?90:135;
  const colClass=tag=>tag==="holds"?"grn":tag==="revises"?"gold":"red";
  const xs=[padX,W/2,W-padX];
  const pts=traj.nodes.map((n,i)=>[xs[i],yFor(n.tag)]);
  // baseline (the stated principle)
  let out=`<line class="s-b1" x1="${padX-20}" y1="45" x2="${W-padX+20}" y2="45" stroke-width="1" stroke-dasharray="4 4"/>`;
  out+=`<text class="svg-lbl f-t3" x="${padX-20}" y="38" text-anchor="start">Principle held</text>`;
  // connecting path
  out+=`<polyline class="f-none s-track" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  pts.forEach((p,i)=>{
    const cc=colClass(traj.nodes[i].tag);
    out+=`<circle class="f-${cc==='gold'?'goldl':cc}" cx="${p[0]}" cy="${p[1]}" r="8"/>`;
    out+=`<text class="svg-lbl f-t2" x="${p[0]}" y="${p[1]+26}" text-anchor="middle">${esc(traj.nodes[i].header)}</text>`;
    out+=`<text class="svg-lbl f-t3" x="${p[0]}" y="${p[1]-14}" text-anchor="middle">${traj.nodes[i].tag.toUpperCase()}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Escalation trajectory">${out}</svg>`;
}

function quadrantName(coh,con){
  const hc=coh>=60,hk=con>=60;
  return hc&&hk?"Anchored":hc&&!hk?"Adaptive":!hc&&hk?"Untested":"Fragmented";
}

/* ---------- STUDENT: final ---------- */
function rFinal(){
  const R=S.results, coh=R.score, con=S.trajectory.score;
  const t=S.trajectory;
  const d=S.dilemma;
  const p=d.principles.find(x=>x.id===S.principleId);

  if(t.buckled>0&&t.principled===0)conGrd="Moved under pressure — capitulation, not revision.";

  let insight;

  else if(coh>=80&&con<60)insight="Your belief system is consistent, but under pressure you moved away from the principle you committed to. Whether that was principled revision or capitulation is the whole question — and your own answers to the 'why' prompts are the most honest record you have of it.";
  else if(coh<60&&con>=80)insight="You held your principle throughout — but your Part I responses reveal several simultaneously held beliefs that contradict each other. The scenario may have worked precisely because it only activated one thread of that belief system. A different dilemma might have pulled you apart.";
  else insight="Your positions contain internal tensions, and the scenario revealed a further gap between stated principle and action under pressure. This is not unusual — most people hold more beliefs than they can consistently act on. The question is which ones you are willing to examine.";

  const ctNote=bad.length===0?"No contradictions detected in Part I.":`${bad.length===1?"One tension":bad.length+" tensions"} identified: ${bad.map(c=>c.title).join(", ")}.`;

  const decRows=t.nodes.map((n,i)=>{

    return`<div class="jrow ${n.tag==='holds'?'ok':n.tag==='abandons'?'bad':'warn'}">

    </div>`;
  }).join("");

  return `
<span class="eyebrow">Debrief &mdash; Your Results</span>
<div class="head-icon">${icon(d.chainId)}<h2>The ${esc(d.title.replace(/^The\s+/,""))} Verdict</h2></div>
<div class="final-grid">
  <div class="sc-card">
    <div class="scn" style="color:${bandColorVar(coh)}">${coh}</div>
    <div class="sct">Coherence Score</div>
    <div class="scg">${cohGrd}</div>
  </div>
  <div class="sc-card">
    <div class="scn" style="color:${bandColorVar(con)}">${con}</div>

  </div>
</div>
<div class="svg-wrap">${svgTrajectory(t)}<div class="svg-cap">Where you drifted from the principle you stated</div></div>

function tClassVector(){
  // Modal response per statement -> vector[15]
  const v=new Array(15).fill(0);
  for(let id=0;id<15;id++){
    if(S.inputStyle==="majority"){
      v[id]=S.majority[id]!=null?S.majority[id]:0;
    }else{
      const t=S.tallies[id]||[0,0,0,0,0];
      const mx=Math.max(...t);
      if(mx<=0){v[id]=0;continue;}
      // Tie-break toward the centre: a 5-SD/5-SA split reads as neutral, not
      // as the lowest bucket. Same-side ties collapse to that side.
      const tied=[];t.forEach((c,i)=>{if(c===mx)tied.push(i);});
      const mid=Math.round(tied.reduce((a,b)=>a+b,0)/tied.length);
      v[id]=mid-2;
    }
  }
  return v;
}
function isPolarised(counts){
  const total=counts.reduce((a,b)=>a+b,0);
  if(total<4)return false;
  const low=counts[0]+counts[1], high=counts[3]+counts[4], mid=counts[2];
  return low>=total*0.3 && high>=total*0.3 && mid<Math.max(low,high);
}

function rTReveal(){

function fmtTime(s){const m=Math.floor(s/60);const ss=s%60;return m+":"+String(ss).padStart(2,"0");}
function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function toggleTimer(){
  if(S.timerId){stopTimer();render();return;}
  if(S.timerLeft<=0)S.timerLeft=120;
  S.timerId=setInterval(()=>{
    S.timerLeft--;
    const el=document.getElementById("tm-clock");
    if(el)el.textContent=fmtTime(S.timerLeft);
    if(S.timerLeft<=0){stopTimer();render();}
  },1000);
  render();
}
function skipTimer(){stopTimer();S.timerLeft=0;render();}

function startAssessment(){S.screen="assessment";S.curIdx=0;render();}

function answer(idAndVal){
  if(S.advancing)return;
  const[id,val]=idAndVal.split(":").map(Number);
  S.responses[id]=val;
  render();
  S.advancing=true;
  setTimeout(()=>{
    S.advancing=false;
    if(S.curIdx<14){S.curIdx++;render();}
    else{S.screen="analyzing";render();setTimeout(()=>{finishPartI();},2300);}
  },420);
}
function finishPartI(){
  S.results=analyze(S.responses);
  S.dilemma=DILEMMAS.find(d=>d.chainId===S.results.stressId);
  go("reveal");
}
function backStmt(){if(S.curIdx>0){S.curIdx--;render();}}

function selP(id){S.principleId=id;render();}
function startEsc(){
  if(!S.principleId)return;
  S.escStep=1;S.escChoices=[];S.reasons=[null,null,null];
  S.playedChains.push(S.dilemma.chainId);
  go("escalation");
}
function selC(i){
  i=Number(i);
  const prev=S.escChoices[S.escStep-1];
  S.escChoices[S.escStep-1]=i;
  if(prev!==i)S.reasons[S.escStep-1]=null; // reset reason if choice changed
  render();
}
function setReason(r){S.reasons[S.escStep-1]=r;render();}
function nextEsc(){S.escStep++;render();}
function finalize(){
  S.trajectory=scoreTrajectory(S.dilemma,S.principleId,S.escChoices,S.reasons);
  go("final");
}
function replay(chainId){
  chainId=Number(chainId);
  S.dilemma=DILEMMAS.find(d=>d.chainId===chainId);
  S.principleId=null;S.escStep=1;S.escChoices=[];S.reasons=[null,null,null];S.trajectory=null;
  go("scenario");
}
function restart(){
  S.screen="intro";S.responses=new Array(15).fill(null);S.curIdx=0;
  S.results=null;S.dilemma=null;S.principleId=null;S.escStep=1;
  S.escChoices=[];S.reasons=[null,null,null];S.trajectory=null;S.playedChains=[];
  render();
}

/* teacher actions */
function teacherMode(){S.mode="teacher";S.screen="tintro";resetSession(true);}
function studentMode(){S.mode="student";restart();}
function setInput(v){S.inputStyle=v;render();}
function startTAssess(){S.screen="tassessment";S.curIdx=0;render();}
function tally(arg){
  const[id,cat]=arg.split(":").map(Number);
  if(!S.tallies[id])S.tallies[id]=[0,0,0,0,0];
  S.tallies[id][cat]++;
  render();
}
function untally(arg){
  const[id,cat]=arg.split(":").map(Number);
  if(!S.tallies[id])return;
  S.tallies[id][cat]=Math.max(0,S.tallies[id][cat]-1);
  render();
}
function tallyAdjust(cat,delta){
  const id=STMTS[ORDER[S.curIdx]].id;
  if(!S.tallies[id])S.tallies[id]=[0,0,0,0,0];
  S.tallies[id][cat]=Math.max(0,S.tallies[id][cat]+delta);
  render();
}
function major(arg){const[id,val]=arg.split(":").map(Number);S.majority[id]=val;render();}
function tNext(){if(S.curIdx<14){S.curIdx++;render();}}
function tBack(){if(S.curIdx>0){S.curIdx--;render();}}
function tAnalyze(){
  S.screen="tanalyzing";render();
  setTimeout(()=>{
    S.results=analyze(tClassVector());
    S.dilemma=DILEMMAS.find(d=>d.chainId===S.results.stressId);
    go("treveal");
  },1800);
}
function startTEsc(){if(!S.principleId)return;S.escStep=1;S.escTally={};S.escMajority={};S.timerLeft=0;go("tescalation");}
function eTally(i){i=Number(i);const s=S.escStep;if(!S.escTally[s])S.escTally[s]=[0,0,0];S.escTally[s][i]++;
  // majority follows the leading tally
  let mi=0,mx=-1;S.escTally[s].forEach((c,j)=>{if(c>mx){mx=c;mi=j;}});S.escMajority[s]=mi;render();}
function eMajor(i){S.escMajority[S.escStep]=Number(i);render();}
function tNextEsc(){S.escStep++;S.timerLeft=0;stopTimer();render();}
function tFinalize(){
  const choices=[1,2,3].map(s=>S.escMajority[s]);
  S.trajectory=scoreTrajectory(S.dilemma,S.principleId,choices,[null,null,null]);
  go("tfinal");
}
function resetSession(silent){
  stopTimer();
  S.responses=new Array(15).fill(null);S.curIdx=0;S.results=null;S.dilemma=null;
  S.principleId=null;S.escStep=1;S.escChoices=[];S.reasons=[null,null,null];S.trajectory=null;
  S.tallies={};S.majority={};S.escTally={};S.escMajority={};S.timerLeft=0;
  if(S.mode==="teacher")S.screen="tintro";else S.screen="intro";
  if(!silent)render();else render();
}

const ACTIONS={
  start:startAssessment,answer:answer,back:backStmt,go:a=>go(a),
  selP:selP,startEsc:startEsc,selC:selC,reason:setReason,nextEsc:nextEsc,
  finalize:finalize,replay:replay,restart:restart,
  "teacher-mode":teacherMode,"student-mode":studentMode,
  setInput:setInput,startTAssess:startTAssess,tally:tally,untally:untally,major:major,
  tnext:tNext,tback:tBack,tanalyze:tAnalyze,
  startTEsc:startTEsc,etally:eTally,emajor:eMajor,tnextEsc:tNextEsc,tfinalize:tFinalize,
  "timer-toggle":toggleTimer,"timer-skip":skipTimer,"reset-session":()=>resetSession(false),
};

document.getElementById("app").addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const act=el.getAttribute("data-action");
  const arg=el.getAttribute("data-arg");
  const fn=ACTIONS[act];
  if(fn)fn(arg);
});

/* =====================================================================
   KEYBOARD
   ===================================================================== */
document.addEventListener("keydown",e=>{
  const k=e.key;
  // Student Part I: 1-5 answers, Enter advances (back).
  if(S.mode==="student"&&S.screen==="assessment"){
    if(k>="1"&&k<="5"){e.preventDefault();answer(ORDER[S.curIdx]+":"+((+k)-3));return;}
    if(k==="Enter"&&S.curIdx>0){/* already auto-advances on answer */}
    if(k==="Backspace"){e.preventDefault();backStmt();return;}
  }
  // Student Part I generic Enter to advance primary button
  if(k==="Enter"){
    const primary=document.querySelector(".btn.primary:not([disabled])");
    if(primary){e.preventDefault();primary.click();return;}
  }
  // Teacher: arrow nav + tally keys
  if(S.mode==="teacher"){
    if(S.screen==="tassessment"&&S.inputStyle==="tally"){
      // Match by physical key (e.code): Shift turns e.key into a symbol, so a
      // decrement bound to e.key would never fire. Digit and Numpad both work.
      const m=/^(?:Digit|Numpad)([1-5])$/.exec(e.code);
      if(m){e.preventDefault();tallyAdjust((+m[1])-1, e.shiftKey?-1:1);return;}
    }
    if(k==="ArrowRight"){e.preventDefault();teacherAdvance();return;}
    if(k==="ArrowLeft"){e.preventDefault();teacherRetreat();return;}
  }
});

function teacherAdvance(){
  // advance the primary button if present
  const p=document.querySelector(".btn.primary:not([disabled])");
  if(p){p.click();return;}
  if(S.screen==="tassessment"){if(S.curIdx<14)tNext();else tAnalyze();}
}
function teacherRetreat(){
  if(S.screen==="tassessment"){tBack();return;}
  const order=TEACHER_SCREENS;
  const i=order.indexOf(S.screen);
  if(i>0)go(order[i-1]);
}

/* =====================================================================
   BOOT
   ===================================================================== */
if(S.mode==="teacher")S.screen="tintro";
render();

})();
</script>
